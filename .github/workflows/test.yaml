name: Model Training CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  pull-requests: write


jobs:

  train-model:

    name: Train Iris Classification Model

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout Repository
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # Setup Python 3.12
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ==========================================
      # Install Dependencies
      # ==========================================

      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==========================================
      # Train Model
      # ==========================================

      - name: Train Model
        run: |

          python train_model.py


      # ==========================================
      # Verify Model Outputs
      # ==========================================

      - name: Verify Generated Files
        run: |

          echo "======================================"
          echo "Generated Model Files"
          echo "======================================"

          ls -lh outputs/

          echo ""
          echo "======================================"
          echo "Model Scores"
          echo "======================================"

          cat outputs/scores.txt


      # ==========================================
      # Upload Model Reports
      # ==========================================

      - name: Upload Model Reports
        uses: actions/upload-artifact@v4

        with:

          name: iris-model-report

          path: |
            outputs/scores.txt
            outputs/ConfusionMatrix_LogisticRegression.png
            outputs/ConfusionMatrix_RandomForest.png
            outputs/FeatureImportance.png
            outputs/ModelComparison.png
